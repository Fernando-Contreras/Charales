<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b3c5d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Charales</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#0b3c5d; --bg2:#0e5a82; --ink:#ffffff; --soft:#bfe3f5;
    --accent:#ffc93c; --accent-ink:#3a2a00; --good:#19a35b; --pass:#e8590c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:manipulation}
  button{font:inherit;color:inherit;border:0;cursor:pointer}
  .screen{position:fixed;inset:0;display:none}
  .screen.on{display:flex}

  /* ---------- Menú ---------- */
  #menu{flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;
    background:radial-gradient(circle at 50% 20%,var(--bg2),var(--bg) 70%)}
  .logo{text-align:center}
  .logo .fish{font-size:64px;line-height:1;display:inline-block;animation:swim 2.4s ease-in-out infinite}
  @keyframes swim{0%,100%{transform:translateX(-8px) rotate(-4deg)}50%{transform:translateX(8px) rotate(4deg)}}
  .logo h1{margin:6px 0 0;font-size:clamp(44px,13vmin,84px);letter-spacing:-1px;font-weight:900}
  .logo p{margin:4px 0 0;color:var(--soft);font-size:16px}
  .row{display:flex;gap:12px;width:min(420px,100%)}
  .small{flex:1;background:rgba(255,255,255,.13);border-radius:16px;padding:14px 10px;font-size:17px;font-weight:700}
  .small:active,.big:active{transform:scale(.97)}
  .big{width:min(420px,100%);background:var(--accent);color:var(--accent-ink);border-radius:22px;
    padding:24px 10px;font-size:34px;font-weight:900;box-shadow:0 6px 0 #c9971a}
  @media (orientation:landscape) and (max-height:480px){
    #menu{flex-direction:row;flex-wrap:wrap;gap:16px 28px}
    .logo .fish{font-size:44px}
    .menu-btns{display:flex;flex-direction:column;gap:14px;width:min(380px,48%)}
    .menu-btns .row,.menu-btns .big{width:100%}
  }
  .menu-btns{display:flex;flex-direction:column;gap:18px;align-items:center;width:100%}

  /* ---------- Cómo jugar ---------- */
  #how{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
  #how.on{display:flex}
  .card{background:#fff;color:#12303f;border-radius:22px;padding:22px;width:min(460px,100%);max-height:100%;overflow:auto}
  .card h2{margin:0 0 12px;font-size:24px}
  .card ol{margin:0;padding:0;list-style:none;display:grid;gap:10px}
  .card li{display:flex;gap:12px;align-items:center;font-size:17px;line-height:1.3}
  .card li span:first-child{font-size:28px;width:36px;text-align:center;flex:none}
  .card button{margin-top:16px;width:100%;background:var(--bg);color:#fff;border-radius:14px;padding:14px;font-size:18px;font-weight:800}

  /* ---------- Juego (siempre horizontal) ---------- */
  #game{background:var(--bg);align-items:center;justify-content:center;transition:background .15s}
  #game.good{background:var(--good)}
  #game.pass{background:var(--pass)}
  #game.end{background:#7a1f1f}
  @media (orientation:portrait){
    /* si el celular no giró la pantalla, la giramos nosotros */
    #game{inset:auto;top:0;left:0;width:100vh;height:100vw;transform-origin:top left;
      transform:translateX(100vw) rotate(90deg)}
  }
  #barWrap{position:absolute;top:0;left:0;right:0;height:14px;background:rgba(0,0,0,.28)}
  #bar{height:100%;width:100%;background:var(--accent);transform-origin:left center}
  #bar.low{background:#ff5a4f}
  #wordBox{position:absolute;inset:14px 0 0 0;display:flex;align-items:center;justify-content:center;padding:4%}
  #word{font-weight:900;text-align:center;line-height:1.05;text-wrap:balance;overflow-wrap:anywhere}
  #hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:14px;color:rgba(255,255,255,.65)}
  #quit{position:absolute;top:22px;left:10px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.25);font-size:18px}
  .tap{position:absolute;top:14px;bottom:0;width:50%;background:transparent;display:none}
  #tapPass{left:0}#tapGood{right:0}
  #game.touch .tap{display:block}

  /* ---------- Resultados ---------- */
  #results{flex-direction:column;align-items:center;padding:20px 18px;gap:12px;background:var(--bg)}
  #results h2{margin:0;font-size:22px;color:var(--soft);font-weight:700}
  #score{font-size:64px;font-weight:900;line-height:1}
  #score small{font-size:20px;color:var(--soft);font-weight:700}
  #list{flex:1;min-height:0;overflow:auto;width:min(520px,100%);display:grid;gap:8px;align-content:start;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .it{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:12px;font-size:18px;font-weight:700}
  .it.g{background:rgba(25,163,91,.9)}
  .it.p{background:rgba(255,255,255,.1);color:#d6e6ee;text-decoration:line-through;text-decoration-color:rgba(255,255,255,.45)}
  .it b{flex:none;width:22px;text-align:center;text-decoration:none;display:inline-block}
  .rbtns{display:flex;gap:10px;width:min(520px,100%)}
  .rbtns .big{font-size:22px;padding:16px 8px;flex:2;box-shadow:0 4px 0 #c9971a}
  .rbtns .small{flex:1}
</style>
</head>
<body>

<!-- MENÚ -->
<section id="menu" class="screen on">
  <div class="logo">
    <div class="fish">🐟</div>
    <h1>Charales</h1>
    <p data-t="tagline"></p>
  </div>
  <div class="menu-btns">
    <div class="row">
      <button class="small" id="btnLang"></button>
      <button class="small" id="btnHow" data-t="how"></button>
    </div>
    <button class="big" id="btnPlay" data-t="play"></button>
  </div>
</section>

<!-- CÓMO JUGAR -->
<div id="how">
  <div class="card">
    <h2 data-t="how"></h2>
    <ol id="howList"></ol>
    <button id="btnHowOk" data-t="ok"></button>
  </div>
</div>

<!-- JUEGO -->
<section id="game" class="screen">
  <div id="barWrap"><div id="bar"></div></div>
  <div id="wordBox"><div id="word"></div></div>
  <button class="tap" id="tapPass" aria-label="pass"></button>
  <button class="tap" id="tapGood" aria-label="correct"></button>
  <div id="hint"></div>
  <button id="quit" aria-label="salir">✕</button>
</section>

<!-- RESULTADOS -->
<section id="results" class="screen">
  <h2 data-t="timeup"></h2>
  <div id="score"></div>
  <div id="list"></div>
  <div class="rbtns">
    <button class="small" id="btnMenu" data-t="menu"></button>
    <button class="big" id="btnAgain" data-t="again"></button>
  </div>
</section>

const LISTS = {};
for (const k in WORDS) LISTS[k] = [...new Set(WORDS[k].split("|").map(s => s.trim()).filter(Boolean))];

/* =====================================================
   ESTADO
   ===================================================== */
const ROUND_MS = 60000;
const TILT_TRIGGER = 40;   // grados para marcar
const TILT_NEUTRAL = 22;   // grados para "volver al centro"
const $ = id => document.getElementById(id);
const store = { get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
                set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} } };

let lang = store.get("charales_lang") || ((navigator.language||"es").startsWith("en") ? "en" : "es");
let state = "menu";          // menu | ready | count | play | results
let decks = { es:[], en:[] };
let current = "", results = [];
let endAt = 0, raf = 0, timers = [];
let tilt = 0, sensor = false, armed = true, markAt = 0, lastTick = 0;
let wakeLock = null, audio = null;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

/* =====================================================
   IDIOMA
   ===================================================== */
function applyLang(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t[el.dataset.t]);
  $("btnLang").textContent = t.langBtn;
  $("howList").innerHTML = t.steps.map(s => `<li><span>${s[0]}</span><span>${s[1]}</span></li>`).join("");
}
$("btnLang").onclick = () => { lang = lang === "es" ? "en" : "es"; store.set("charales_lang", lang); applyLang(); };
$("btnHow").onclick = () => $("how").classList.add("on");
$("btnHowOk").onclick = () => $("how").classList.remove("on");
$("how").onclick = e => { if (e.target.id === "how") $("how").classList.remove("on"); };

/* =====================================================
   UTILIDADES
   ===================================================== */
function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
}
function later(fn, ms){ const id = setTimeout(fn, ms); timers.push(id); return id; }
function clearTimers(){ timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf); }

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function drawWord(){
  if (!decks[lang].length) decks[lang] = shuffle(LISTS[lang].slice());
  return decks[lang].pop();
}

function setWord(text){
  const el = $("word"), box = $("wordBox");
  el.textContent = text;
  el.style.whiteSpace = text.includes("\n") ? "pre-line" : "normal";
  const cs = getComputedStyle(box);
  const maxW = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const maxH = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  let size = Math.floor(maxH * 0.62);
  el.style.fontSize = size + "px";
  while (size > 18 && (el.scrollWidth > maxW || el.offsetHeight > maxH)){
    size = Math.floor(size * 0.92);
    el.style.fontSize = size + "px";
  }
}

function beep(freq, dur, type, when){
  if (!audio) return;
  try{
    const t0 = audio.currentTime + (when || 0);
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.35, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(audio.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }catch(e){}
}
const sfx = {
  good(){ beep(660,.12,"triangle"); beep(990,.2,"triangle",.1); },
  pass(){ beep(300,.22,"sawtooth"); },
  tick(){ beep(880,.07,"square"); },
  count(){ beep(520,.12,"sine"); },
  go(){ beep(1040,.3,"sine"); },
  end(){ beep(440,.2,"square"); beep(330,.2,"square",.2); beep(220,.5,"square",.4); }
};
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

async function goFullscreenLandscape(){
  try{ await document.documentElement.requestFullscreen({ navigationUI:"hide" }); }catch(e){}
  try{ await screen.orientation.lock("landscape"); }catch(e){}
  try{ wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
}
function releaseScreen(){
  try{ screen.orientation.unlock(); }catch(e){}
  try{ wakeLock && wakeLock.release(); }catch(e){}
  wakeLock = null;
}

/* =====================================================
   SENSOR DE INCLINACIÓN
   Usamos la gravedad sobre el eje Z (el que "sale" de la pantalla).
   Celular parado = 0°. Pantalla viendo al techo = +90°. Al piso = -90°.
   Así funciona igual sin importar hacia qué lado esté acostado.
   ===================================================== */
function onMotion(e){
  const a = e.accelerationIncludingGravity;
  if (!a || a.z == null) return;
  const n = Math.hypot(a.x || 0, a.y || 0, a.z);
  if (n < 5 || n > 15) return;                 // sacudida fuerte: ignorar
  let t = Math.asin(Math.max(-1, Math.min(1, a.z / n))) * 180 / Math.PI;
  if (isIOS) t = -t;                           // iOS reporta el signo al revés
  tilt = sensor ? tilt * 0.55 + t * 0.45 : t;
  sensor = true;
  onTilt();
}
function onTilt(){
  if (state === "ready"){
    if (Math.abs(tilt) < TILT_NEUTRAL + 6) startCountdown();
  } else if (state === "play"){
    if (armed){
      if (tilt > TILT_TRIGGER) mark(true);
      else if (tilt < -TILT_TRIGGER) mark(false);
    } else if (Math.abs(tilt) < TILT_NEUTRAL && performance.now() - markAt > 550){
      nextWord();
    }
  }
}
async function enableMotion(){
  try{
    if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function"){
      await DeviceMotionEvent.requestPermission();
    }
  }catch(e){}
  // Si lo negaron, simplemente no llegan lecturas y se juega tocando.
  window.removeEventListener("devicemotion", onMotion);
  window.addEventListener("devicemotion", onMotion);
}

/* =====================================================
   FLUJO DEL JUEGO
   ===================================================== */
async function startGame(){
  try{ audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); }catch(e){}
  clearTimers();
  results = []; current = ""; sensor = false; armed = true;
  state = "ready";
  $("game").className = "screen on";
  show("game");
  $("bar").style.transform = "scaleX(1)"; $("bar").classList.remove("low");
  $("hint").textContent = "";
  await Promise.all([enableMotion(), goFullscreenLandscape()]);
  if (state !== "ready") return;
  setWord(T[lang].place);
  // Si en 1.5 s no llegó ninguna lectura, no hay sensor: se juega tocando.
  later(() => {
    if (state !== "ready") return;
    if (!sensor){ $("game").classList.add("touch"); $("hint").textContent = T[lang].tapHint; startCountdown(); }
  }, 1500);
  // Por si lo tienen inclinado y nunca lo enderezan: arrancar de todos modos.
  later(() => { if (state === "ready") startCountdown(); }, 6000);
}

function startCountdown(){
  if (state !== "ready") return;
  state = "count";
  let n = 3;
  const step = () => {
    if (state !== "count") return;
    if (n === 0){ beginRound(); return; }
    setWord(String(n)); sfx.count(); n--; later(step, 800);
  };
  step();
}

function beginRound(){
  state = "play";
  sfx.go(); buzz(80);
  endAt = performance.now() + ROUND_MS;
  lastTick = 6;
  nextWord();
  const loop = () => {
    if (state !== "play") return;
    const left = endAt - performance.now();
    $("bar").style.transform = `scaleX(${Math.max(0, left / ROUND_MS)})`;
    const s = Math.ceil(left / 1000);
    if (s <= 10) $("bar").classList.add("low");
    if (s <= 5 && s < lastTick && s > 0){ lastTick = s; sfx.tick(); }
    if (left <= 0){ endRound(); return; }
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}

function nextWord(){
  if (state !== "play") return;
  armed = true;
  $("game").classList.remove("good", "pass");
  current = drawWord();
  setWord(current);
}

function mark(ok){
  if (state !== "play" || !armed || !current) return;
  armed = false; markAt = performance.now();
  results.push({ w: current, ok });
  current = "";
  $("game").classList.add(ok ? "good" : "pass");
  setWord(T[lang][ok ? "good" : "pass"]);
  ok ? sfx.good() : sfx.pass();
  buzz(ok ? [60, 40, 60] : 150);
  if (!sensor) later(nextWord, 650);        // sin sensor no hay "volver al centro"
  else later(() => { if (!armed) nextWord(); }, 2500); // red de seguridad
}

function endRound(){
  if (current) results.push({ w: current, ok: false });   // la que se quedó en pantalla
  current = "";
  state = "results";
  clearTimers();
  sfx.end(); buzz([200, 100, 200]);
  $("game").classList.remove("good", "pass"); $("game").classList.add("end");
  $("bar").style.transform = "scaleX(0)";
  setWord(T[lang].timeup);
  later(showResults, 1600);
}

function showResults(){
  releaseScreen();
  const good = results.filter(r => r.ok).length;
  $("score").innerHTML = `${good} <small>${T[lang].pts}</small>`;
  const list = $("list"); list.innerHTML = "";
  results.forEach(r => {
    const d = document.createElement("div");
    d.className = "it " + (r.ok ? "g" : "p");
    const b = document.createElement("b"); b.textContent = r.ok ? "✓" : "✗";
    const s = document.createElement("span"); s.textContent = r.w;
    d.append(b, s); list.append(d);
  });
  show("results");
}

function toMenu(){
  state = "menu"; clearTimers(); releaseScreen();
  try{ document.fullscreenElement && document.exitFullscreen(); }catch(e){}
  show("menu");
}

$("btnPlay").onclick = startGame;
$("btnAgain").onclick = startGame;
$("btnMenu").onclick = toMenu;
$("quit").onclick = toMenu;
$("tapGood").onclick = () => mark(true);
$("tapPass").onclick = () => mark(false);
addEventListener("keydown", e => {
  if (state !== "play") return;
  if (e.key === "ArrowUp" || e.key === "ArrowRight") mark(true);
  if (e.key === "ArrowDown" || e.key === "ArrowLeft") mark(false);
});
addEventListener("resize", () => { if (state === "play" && current) setWord(current); });
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && (state === "play" || state === "count" || state === "ready")){
    try{ wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
  }
});

applyLang();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
